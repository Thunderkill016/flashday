<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5EF" />
    <script src="/canonical.js"></script>
    <title>Đang đăng nhập — FlashDay</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../site.css" />
  </head>
  <body>
    <main class="auth-wrap">
      <div class="auth-card auth-transition">
        <div class="auth-brand">FlashDay<span class="brand-dot">.</span></div>
        <div class="auth-spin" id="auth-spin"></div>
        <p id="auth-status" role="status" aria-live="polite">Đang hoàn tất đăng nhập…</p>
        <a class="auth-retry" id="auth-retry" href="/login/#signin" hidden>Quay lại đăng nhập</a>
      </div>
    </main>
    <script type="module" src="auth.js"></script>
  </body>
</html>
