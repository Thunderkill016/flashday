<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đang đăng nhập — FlashDay</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #f0f0ea;
        font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      }
      .box {
        text-align: center;
        max-width: 320px;
        padding: 24px;
      }
      .brand {
        font-weight: 600;
        font-size: 20px;
        letter-spacing: -0.02em;
        margin-bottom: 28px;
      }
      .brand b {
        color: #d8ff3e;
      }
      .spin {
        width: 36px;
        height: 36px;
        margin: 0 auto 20px;
        border: 3px solid #2a2a2a;
        border-top-color: #d8ff3e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #auth-status {
        font-size: 14px;
        line-height: 1.55;
        color: #b9b9ae;
      }
      #auth-status[data-tone='error'] {
        color: #ff8f8f;
      }
      .retry {
        display: inline-block;
        margin-top: 18px;
        padding: 10px 22px;
        background: #d8ff3e;
        color: #111;
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      .retry[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="brand">FlashDay<b>.</b></div>
      <div class="spin" id="auth-spin"></div>
      <p id="auth-status">Đang hoàn tất đăng nhập…</p>
      <a class="retry" id="auth-retry" href="/login/#signin" hidden
        >Quay lại đăng nhập</a
      >
    </div>
    <script type="module" src="auth.js"></script>
  </body>
</html>
