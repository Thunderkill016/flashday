<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — FlashDay</title>
  <link rel="icon" href="data:,">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

  <div class="noise-overlay"></div>

  <div class="auth-box-brutal">
    <a href="/" class="auth-back">← Trở về</a>
    
    <div class="auth-brand">FlashDay<span class="brand-dot">.</span></div>
    
    <div class="auth-header">
      <h2 class="auth-title" id="auth-title">Chào mừng trở lại</h2>
      <p class="auth-sub" id="auth-sub">Đăng nhập để đồng bộ tiến độ học tập</p>
    </div>
    
    <div class="auth-tabs" id="auth-tabs" role="tablist">
      <button class="auth-tab" type="button" role="tab" aria-selected="false" data-tab="signup">Đăng ký</button>
      <button class="auth-tab active" type="button" role="tab" aria-selected="true" data-tab="signin">Đăng nhập</button>
    </div>

    <div class="auth-providers" id="auth-providers">
      <button class="btn-provider" id="auth-google-btn" type="button">
        <svg class="icon-provider" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
        Tiếp tục bằng Google
      </button>
    </div>

    <div class="auth-divider" id="auth-divider"><span>HOẶC</span></div>

    <form class="auth-form" id="auth-form" novalidate>
      <div class="input-group" id="email-field">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" autocomplete="username" placeholder="name@example.com" required>
        </div>
      </div>
      
      <div class="input-group" id="password-field">
        <div class="label-row">
          <label for="password">Mật khẩu</label>
          <button type="button" class="auth-link hidden" id="forgot-password">Quên mật khẩu?</button>
        </div>
        <div class="input-wrapper">
          <div class="password-input-wrapper">
            <input type="password" id="password" autocomplete="current-password" minlength="8" placeholder="••••••••" required>
            <button type="button" class="password-toggle" id="toggle-password" aria-label="Hiện mật khẩu" aria-pressed="false">
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="input-group hidden" id="password-confirm-field">
        <label for="password-confirm">Xác nhận mật khẩu</label>
        <div class="input-wrapper">
          <input type="password" id="password-confirm" autocomplete="new-password" minlength="8" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="auth-submit-btn">Đăng nhập</button>
      
      <button type="button" class="auth-link-alt hidden" id="return-to-signin">Quay lại đăng nhập</button>
      <p class="auth-status hidden" id="auth-status" role="status" aria-live="polite"></p>
    </form>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
