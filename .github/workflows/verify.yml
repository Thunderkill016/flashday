name: Verify FlashDay

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:full
      # 390px visual gate for the mission lesson — reviewers download the
      # mission-shots artifact instead of trusting DOM tests (#33).
      - run: node qa-mission-shots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mission-shots
          path: mission-shots/
          retention-days: 14
